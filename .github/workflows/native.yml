name: Native regression checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build tools
        run: python -m pip install meson ninja
      - name: Linux compiler
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y libstdc++-14-dev libcurl4-openssl-dev libxcb-randr0-dev libwayland-dev libpugixml-dev
          echo CC=clang-22 >> "$GITHUB_ENV"
          echo CXX=clang++-22 >> "$GITHUB_ENV"
      - name: macOS compiler
        if: runner.os == 'macOS'
        run: |
          brew install llvm pkgconf
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
      - name: Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade llvm --yes --no-progress
          choco install pkgconfiglite --yes --no-progress
          'C:/Program Files/LLVM/bin' >> $env:GITHUB_PATH
          'CC=clang' >> $env:GITHUB_ENV
          'CXX=clang++' >> $env:GITHUB_ENV
      - name: Configure
        run: meson setup build --prefix "${{ github.workspace }}/sdk-stage" --libdir lib -Dplugins=enabled -Dbuild_python=true -Dbuild_csharp=true -Dnative_tuning=false
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --no-rebuild --print-errorlogs
      - name: Install SDK
        run: meson install -C build --no-rebuild
      - name: Verify installed consumers
        run: python tools/verify_installed_sdk.py sdk-stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-logs-${{ matrix.os }}
          path: build/meson-logs/
